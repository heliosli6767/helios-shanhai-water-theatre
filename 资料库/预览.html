<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>山海水戏 · 数字资产资料库</title>
<style>
:root{font-family:"PingFang SC",system-ui,sans-serif;color:#e8e1d4;background:#122326;color-scheme:dark}*{box-sizing:border-box}body{margin:0}header{padding:38px clamp(18px,4vw,68px) 24px;border-bottom:1px solid #45605d;background:linear-gradient(120deg,#193c3d,#14272b)}.eyebrow{font-size:11px;letter-spacing:.24em;color:#d7b782}h1{font:normal clamp(28px,4vw,46px) "Songti SC",serif;margin:12px 0}header p{max-width:880px;line-height:1.8;font-size:13px;color:#b7c6be}a{color:#e8c691}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:20px clamp(18px,4vw,68px);position:sticky;top:0;background:#122326ed;z-index:2;backdrop-filter:blur(12px)}select,input,button{font:inherit;padding:11px 14px;border:1px solid #526964;background:#20383a;color:#f0e7d6;border-radius:4px}input{min-width:180px;flex:1}button{cursor:pointer}#count{font-size:12px;color:#c3b99d;padding:0 4px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:24px;padding:4px clamp(18px,4vw,68px) 60px}.card{border:1px solid #3b5552;background:#1b3133;overflow:hidden;border-radius:5px}.picture{position:relative;aspect-ratio:4/3;display:grid;place-items:center;background:#253e40;overflow:hidden}.picture img{width:100%;height:100%;object-fit:contain;background:#b3aaa0;cursor:zoom-in}.picture .pending{font:14px "Songti SC",serif;letter-spacing:.2em;color:#92a4a0}.info{padding:16px}.info small{font-size:10px;color:#b6bbab}.info h2{font:23px "Songti SC",serif;margin:10px 0}.info p{font-size:11px;color:#a9bcb5;line-height:1.6}.links{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;align-items:center}.review{padding:6px 10px;font-size:12px;background:none}.review.selected{color:#122326;background:#dfc18e}.badge{font-size:10px;position:absolute;left:10px;top:10px;background:#11272ccc;border:1px solid #64867b;padding:5px 8px;border-radius:3px;pointer-events:none}dialog{width:min(1200px,96vw);height:92vh;padding:14px;background:#102124;border:1px solid #738b7a;border-radius:6px}dialog::backdrop{background:#000b}dialog img{width:100%;height:calc(100% - 58px);object-fit:contain}dialog .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px}#empty{padding:20px 5vw}.foot{font-size:12px;color:#9aafa7;padding:0 5vw 30px}@media(max-width:600px){nav{position:relative}.grid{grid-template-columns:1fr}input{width:100%}}
.picture img{position:absolute;inset:0;min-width:0;min-height:0;display:block}
</style>
</head>
<body>
<header><div class="eyebrow">SHAN HAI · ASSET LIBRARY</div><h1>一物一档 · 山海有形</h1><p>九则故事的背景、人物、道具与特效。3D 风格图片用于定美术方向；只有带有 Blender 下载链接的项目才包含可编辑工程。特效静帧与可播放动画分别标注。</p><a href="../index.html">← 返回山海水戏</a></header>
<nav><select id="story" aria-label="按故事筛选"><option value="">全部故事</option></select><select id="kind" aria-label="按类别筛选"><option value="">全部类别</option><option value="background">背景</option><option value="character">人物</option><option value="prop">道具</option><option value="effect">特效</option><option value="reference">参考</option></select><input id="search" placeholder="搜索：精卫、石子、月光…" aria-label="搜索资产"><button id="refresh">刷新进度</button><span id="count" aria-live="polite"></span></nav>
<main class="grid" id="grid"></main><p id="empty" hidden>没有符合条件的资产。</p><p class="foot">“保留此方向”仅记录在当前浏览器，方便你挑选；不会自动启动新的图片或模型制作。</p>
<dialog id="lightbox"><div class="bar"><span id="caption"></span><button id="close">关闭 ×</button></div><img id="large" alt=""></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);let assets=[];const labels={background:'背景',character:'人物',prop:'道具',effect:'特效静帧',reference:'参考'};
let picks={};try{picks=JSON.parse(localStorage.getItem('shanhai-asset-picks')||'{}')}catch{}
const url=p=>encodeURI(p).replace(/#/g,'%23');
function render(){const filtered=assets.filter(a=>(!$('story').value||a.story===$('story').value)&&(!$('kind').value||a.type===$('kind').value)&&(!($('search').value.trim())||(a.name+a.story).includes($('search').value.trim())));$('grid').replaceChildren();$('empty').hidden=!!filtered.length;
const ready=assets.filter(a=>['generated','reference','legacy'].includes(a.status)).length;$('count').textContent=`${ready} / ${assets.length} 项已有图片 · 当前 ${filtered.length} 项`;
for(const a of filtered){const article=document.createElement('article');article.className='card';const pic=document.createElement('div');pic.className='picture';const imagePath=a.image||`${a.folder}/02_图片/${a.name}_3D视觉_v001.png`;const img=document.createElement('img');img.loading='lazy';img.alt=a.name;img.src=url(imagePath);img.onerror=()=>{img.remove();const p=document.createElement('span');p.className='pending';p.textContent=a.status==='failed'?'本项生成待重试':'制作队列中';pic.append(p)};img.onclick=()=>{$('large').src=img.src;$('large').alt=a.name;$('caption').textContent=`${a.story} · ${a.name}`;$('lightbox').showModal()};pic.append(img);const badge=document.createElement('span');badge.className='badge';badge.textContent=a.blender?'图片 + Blender':a.status==='reference'?'风格参考':a.status==='legacy'?'旧版参考':a.type==='effect'?'效果设计静帧':'3D 风格图片';pic.append(badge);article.append(pic);
const info=document.createElement('div');info.className='info';const small=document.createElement('small');small.textContent=`${a.id} / ${a.story} / ${labels[a.type]||a.type}`;const h=document.createElement('h2');h.textContent=a.name.replace(/^(第一幕|第二幕|第三幕)_/,'$1 · ');const p=document.createElement('p');p.textContent=a.blender?'包含可编辑场景；工程内说明可编辑内容与背景图层。':a.type==='effect'?'静态效果设计，动画输出制作后另行提供。':'美术概念图片；独立模型、绑定和透明贴图需后续制作。';const links=document.createElement('div');links.className='links';const link=document.createElement('a');link.textContent='打开原图 ↗';link.href=url(imagePath);link.target='_blank';link.rel='noopener';links.append(link);if(a.blender){const b=document.createElement('a');b.textContent='下载 Blender';b.href=url(a.blender);b.download='';links.append(b)}const review=document.createElement('button');review.className='review'+(picks[a.id]?' selected':'');review.textContent=picks[a.id]?'已保留 ✓':'保留此方向';review.onclick=()=>{picks[a.id]=!picks[a.id];try{localStorage.setItem('shanhai-asset-picks',JSON.stringify(picks))}catch{}review.classList.toggle('selected',picks[a.id]);review.textContent=picks[a.id]?'已保留 ✓':'保留此方向'};links.append(review);info.append(small,h,p,links);article.append(info);$('grid').append(article)}}
async function load(){try{const r=await fetch('./制作状态.json?'+Date.now());if(!r.ok)throw Error('无法读取资产目录');const data=await r.json();assets=data.assets;const previous=$('story').value;$('story').replaceChildren(new Option('全部故事',''));for(const name of new Set(assets.map(a=>a.story)))$('story').add(new Option(name,name));$('story').value=previous;render()}catch(e){$('count').textContent='请从本地网页地址打开预览：localhost:4173/资料库/预览.html'}}
for(const id of ['story','kind'])$(id).onchange=render;$('search').oninput=render;$('refresh').onclick=load;$('close').onclick=()=>$('lightbox').close();load();
</script></body></html>
