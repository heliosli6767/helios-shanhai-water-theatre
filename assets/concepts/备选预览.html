<body>
<header><h1>山海水戏 · 视觉备选</h1><p>目录背景三张，水上戏台外框五张。点击图片可查看原图。请分别选一张目录背景和一张戏台外框；原图不会在选定前替换现有画面。</p></header>
<main>
<section><h2>山海奇闻 · 大世界背景</h2><p class="lede">九本故事书会漂浮在山海之间。画面保留水面、群山和仙岛的纵深。</p><div class="grid">
<figure class="card"><a href="./catalog/01-penglai-sunset.png" target="_blank"><img src="./catalog/01-penglai-sunset.png" alt="目录 A：落日蓬莱，浮岛垂瀑，海面辽阔"></a><figcaption><span class="number">目录 A</span><h3>落日蓬莱</h3><p>浮岛、垂瀑与金色海面。气势开阔，适合戏剧化的漂浮书封。</p></figcaption></figure>
<figure class="card"><a href="./catalog/02-waterfall-immortal-sea.png" target="_blank"><img src="./catalog/02-waterfall-immortal-sea.png" alt="目录 B：瀑布仙海，近景山崖与远海落日"></a><figcaption><span class="number">目录 B</span><h3>瀑布仙海</h3><p>远近山层次最强，瀑布更突出，画面偏自然史诗。</p></figcaption></figure>
<figure class="card"><a href="./catalog/03-nine-islands.png" target="_blank"><img src="./catalog/03-nine-islands.png" alt="目录 C：九岛水道，多座不同色彩的仙岛"></a><figcaption><span class="number">目录 C</span><h3>九岛水道</h3><p>每座岛有自己的地貌，适合把九个故事分别安置其上。</p></figcaption></figure>
</div></section>
<section><h2>水上戏台 · 外框</h2><p class="lede">这些是外框概念原图。中央深色区域是供现有故事画面嵌入的占位区；定稿时还需要按所选方案制作可叠加的透明外框。</p><div class="grid">
<figure class="card"><a href="./stage/01-lacquer-pavilion.png" target="_blank"><img src="./stage/01-lacquer-pavilion.png" alt="戏台 1：漆木飞檐，夜色水雾"></a><figcaption><span class="number">戏台 1</span><h3>漆木飞檐</h3><p>深红漆木、雕柱与夜水，木偶戏台感最浓。</p></figcaption></figure>
<figure class="card"><a href="./stage/02-bamboo-water-pavilion.png" target="_blank"><img src="./stage/02-bamboo-water-pavilion.png" alt="戏台 2：竹编水亭，晨光与荷叶"></a><figcaption><span class="number">戏台 2</span><h3>竹编水亭</h3><p>竹屋檐、荷叶和暖光，更轻巧明亮。</p></figcaption></figure>
<figure class="card"><a href="./stage/03-moonstone-water-shrine.png" target="_blank"><img src="./stage/03-moonstone-water-shrine.png" alt="戏台 3：月白石台，瀑布与银色月光"></a><figcaption><span class="number">戏台 3</span><h3>月白石台</h3><p>月光、白石和银色倒影，仙气最强。</p></figcaption></figure>
<figure class="card"><a href="./stage/04-festival-lantern-stage.png" target="_blank"><img src="./stage/04-festival-lantern-stage.png" alt="戏台 4：彩灯庙台，红瓦与水中灯影"></a><figcaption><span class="number">戏台 4</span><h3>彩灯庙台</h3><p>红瓦、灯笼与节庆色彩，夜演氛围更热闹。</p></figcaption></figure>
<figure class="card"><a href="./stage/05-jade-driftwood-arch.png" target="_blank"><img src="./stage/05-jade-driftwood-arch.png" alt="戏台 5：玉石水门，龙形漂木与透亮湖面"></a><figcaption><span class="number">戏台 5</span><h3>玉石水门</h3><p>龙形漂木和玉石拱门，山海经气息更鲜明。</p></figcaption></figure>
</div></section>
